version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
    # egui-wgpu exposes WGPU types in callback traits, so WGPU cannot be
    # upgraded independently. Major graphics-stack upgrades must be reviewed
    # and performed together with egui/eframe.
    ignore:
      - dependency-name: "wgpu"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
