name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Check Files follow ownership
        run: python3 scripts/test-files-follow.py

      - name: Check formatting
        run: cargo fmt --all -- --check

  shell:
    name: Installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install script and metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            desktop-file-utils \
            shellcheck

      - name: Check installer contracts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-paths.sh
          shellcheck scripts/install.sh scripts/uninstall.sh scripts/test-install-paths.sh
          bash scripts/test-install-paths.sh

      - name: Validate desktop integration metadata
        run: |
          desktop-file-validate data/io.github.beamiter.ember.desktop
          appstreamcli validate --pedantic --no-net \
            data/io.github.beamiter.ember.metainfo.xml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: tests

      - name: Start native Agent containment prerequisites
        shell: bash
        run: |
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          runner_uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${runner_uid}.service"
          runtime_dir="/run/user/${runner_uid}"
          test -S "${runtime_dir}/bus"
          {
            echo "XDG_RUNTIME_DIR=${runtime_dir}"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime_dir}/bus"
            echo "EMBER_REQUIRE_NATIVE_CODEX_E2E=1"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: release

      - name: Build release binary
        run: cargo build --workspace --release --all-features --locked

      - name: Install official desktop test packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb openbox xdotool xclip x11-utils sway wtype wl-clipboard grim \
            imagemagick tesseract-ocr fonts-dejavu-core mesa-vulkan-drivers mesa-utils libxkbcommon-x11-0

      - name: Stage optimized desktop candidate
        id: desktop-install
        run: |
          mkdir -p "$RUNNER_TEMP/ember-install-home"
          export HOME="$RUNNER_TEMP/ember-install-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          bash scripts/install.sh --binary "$GITHUB_WORKSPACE/target/release/ember" --prefix "$RUNNER_TEMP/ember-installed"
          cmp "$GITHUB_WORKSPACE/target/release/ember" "$RUNNER_TEMP/ember-installed/bin/ember"
          mkdir -p "$GITHUB_WORKSPACE/native-smoke-artifacts"
          sha256sum "$GITHUB_WORKSPACE/target/release/ember" "$RUNNER_TEMP/ember-installed/bin/ember" > "$GITHUB_WORKSPACE/native-smoke-artifacts/binary-identity.txt"

      - name: Record native release environment
        if: always()
        run: |
          mkdir -p native-smoke-artifacts
          { uname -a; rustc -Vv; dpkg-query -W xvfb sway wtype wl-clipboard libvulkan1 mesa-vulkan-drivers fonts-dejavu-core openbox tesseract-ocr; fc-match monospace; git rev-parse HEAD; sha256sum target/release/ember; } > native-smoke-artifacts/environment.txt

      - name: Gate X11 installed release interactions
        if: steps.desktop-install.outcome == 'success'
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/ember-installed/bin/ember" --backend x11 --output native-smoke-artifacts/x11

      - name: Gate Wayland installed release interactions
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/ember-installed/bin/ember" --backend wayland --output native-smoke-artifacts/wayland

      - name: Preserve real desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ember-native-desktop-${{ github.sha }}
          path: native-smoke-artifacts
          if-no-files-found: error
          retention-days: 14
