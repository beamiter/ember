name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Check Files follow ownership
        run: python3 scripts/test-files-follow.py

      - name: Check formatting
        run: cargo fmt --all -- --check

  font_groups:
    name: Headless font groups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of the full/native test jobs: an unrelated gate failure must
    # not skip the focused production-consumer and Settings regressions.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache headless font test dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: font-groups
          workspaces: font-group-harness -> target

      - name: Test independent UI and main font groups
        run: python3 font-group-harness/run.py

  shell:
    name: Installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install script and metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            desktop-file-utils \
            shellcheck

      - name: Check installer contracts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-paths.sh
          shellcheck scripts/install.sh scripts/uninstall.sh scripts/test-install-paths.sh
          bash scripts/test-install-paths.sh

      - name: Validate desktop integration metadata
        run: |
          desktop-file-validate data/io.github.beamiter.ember.desktop
          appstreamcli validate --pedantic --no-net \
            data/io.github.beamiter.ember.metainfo.xml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            dbus libglib2.0-bin python3-dbus python3-gi vim \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: tests

      - name: Start native Agent containment prerequisites
        shell: bash
        run: |
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          runner_uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${runner_uid}.service"
          runtime_dir="/run/user/${runner_uid}"
          test -S "${runtime_dir}/bus"
          {
            echo "XDG_RUNTIME_DIR=${runtime_dir}"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime_dir}/bus"
            echo "EMBER_REQUIRE_NATIVE_CODEX_E2E=1"
          } >> "$GITHUB_ENV"

      - name: Test vendored keyboard fallback regressions
        run: cargo test -p egui-winit --lib ember_keyboard_fallback_tests --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Gate native Vim fractional selection against a real PTY
        timeout-minutes: 3
        run: >-
          cargo test --lib --all-features --locked
          vim9_buffer::native_input_tests::real_vim_fractional_click_drag_yank_and_cancel_use_the_presented_source
          -- --ignored --exact --nocapture

      - name: Gate isolated native organism preference events
        run: /usr/bin/python3 scripts/test-organism-system-motion.py

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: release

      - name: Build release binary
        run: cargo build --workspace --release --all-features --locked

      - name: Install official desktop test packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb openbox xdotool xclip x11-utils sway wtype wl-clipboard grim \
            dbus python3-dbus python3-pil at-spi2-core imagemagick tesseract-ocr fonts-dejavu-core fonts-noto-cjk mesa-vulkan-drivers mesa-utils libxkbcommon-x11-0 libwayland-bin vim ripgrep

      - name: Stage optimized desktop candidate
        id: desktop-install
        run: |
          mkdir -p "$RUNNER_TEMP/ember-install-home"
          export HOME="$RUNNER_TEMP/ember-install-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          bash scripts/install.sh --binary "$GITHUB_WORKSPACE/target/release/ember" --prefix "$RUNNER_TEMP/ember-installed"
          cmp "$GITHUB_WORKSPACE/target/release/ember" "$RUNNER_TEMP/ember-installed/bin/ember"
          mkdir -p "$GITHUB_WORKSPACE/native-smoke-artifacts"
          sha256sum "$GITHUB_WORKSPACE/target/release/ember" "$RUNNER_TEMP/ember-installed/bin/ember" > "$GITHUB_WORKSPACE/native-smoke-artifacts/binary-identity.txt"

      - name: Record native release environment
        if: always()
        run: |
          mkdir -p native-smoke-artifacts
          { uname -a; rustc -Vv; dpkg-query -W xvfb sway wtype wl-clipboard libvulkan1 mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk openbox tesseract-ocr; fc-match monospace; git rev-parse HEAD; sha256sum target/release/ember; } > native-smoke-artifacts/environment.txt

      - name: Gate X11 installed release interactions
        if: steps.desktop-install.outcome == 'success'
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/ember-installed/bin/ember" --backend x11 --output native-smoke-artifacts/x11

      - name: Gate native Vim buffer GUI colors and real editing
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 scripts/native-vim9-buffer-smoke.py \
            --binary "$RUNNER_TEMP/ember-installed/bin/ember" --app ember \
            --output native-smoke-artifacts/vim9-buffer-gui

      - name: Probe owned Block Search accessibility on isolated X11
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python3 scripts/test-native-block-search-atspi-probe.py
          /usr/bin/python3 scripts/native-block-search-atspi-probe.py --binary "$RUNNER_TEMP/ember-installed/bin/ember" --output native-smoke-artifacts/block-search-atspi-discovery

      - name: Prove public Block Search controls on isolated X11
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          python3 scripts/test-native-block-search-atspi-interaction.py
          /usr/bin/python3 scripts/native-block-search-atspi-interaction.py --binary "$RUNNER_TEMP/ember-installed/bin/ember" --output native-smoke-artifacts/block-search-atspi-interaction

      - name: Gate real X11 bounded block-search correctness
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          python3 scripts/test-native-block-search.py
          python3 scripts/test-native-block-search-atspi-driver.py
          status=0
          for scenario in raw snapshot; do
            if ! /usr/bin/python3 scripts/native-block-search.py \
              --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
              --backend x11 --scenario "$scenario" \
              --output "native-smoke-artifacts/block-search-$scenario"; then
              status=1
            fi
          done
          exit "$status"

      - name: Independent E03 pixel observer pilot
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          python3 scripts/test-native-block-search-observer-pilot.py
          status=0
          for scenario in raw snapshot; do
            if ! /usr/bin/python3 scripts/native-block-search.py \
              --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
              --backend x11 --scenario "$scenario" --observer-pilot \
              --output "native-smoke-artifacts/block-search-observer-pilot-$scenario"; then
              status=1
            fi
          done
          exit "$status"

      - name: Build compositor protocol pointer helper
        id: desktop-pointer
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ember-pointer"
          wayland-scanner client-header scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/ember-pointer/wlr-virtual-pointer-unstable-v1-client-protocol.h"
          wayland-scanner private-code scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/ember-pointer/protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/ember-pointer" scripts/native-pointer.c "$RUNNER_TEMP/ember-pointer/protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/ember-pointer/native-pointer"
          echo "EMBER_POINTER_HELPER=$RUNNER_TEMP/ember-pointer/native-pointer" >> "$GITHUB_ENV"

      - name: Gate Wayland installed release interactions
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/ember-installed/bin/ember" --backend wayland --output native-smoke-artifacts/wayland

      - name: Gate installed session recovery on both desktops
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' && steps.desktop-pointer.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          status=0
          for backend in x11 wayland; do
            for case in normal corrupt-layout over-limit invalid-cwd; do
              if ! python3 scripts/native-session-recovery.py \
                --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
                --backend "$backend" --case "$case" \
                --output "native-smoke-artifacts/recovery-$backend-$case"; then
                status=1
              fi
            done
          done
          exit "$status"

      - name: Build compositor IME Return helper
        id: desktop-ime
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' }}
        run: |
          python3 scripts/test-native-ime-keyboard.py
          python3 scripts/test-native-ime-visual.py
          mkdir -p "$RUNNER_TEMP/ember-ime"
          wayland-scanner client-header scripts/protocols/input-method-unstable-v2.xml "$RUNNER_TEMP/ember-ime/input-method-unstable-v2-client-protocol.h"
          wayland-scanner private-code scripts/protocols/input-method-unstable-v2.xml "$RUNNER_TEMP/ember-ime/protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client xkbcommon) -I"$RUNNER_TEMP/ember-ime" scripts/native-ime-return.c "$RUNNER_TEMP/ember-ime/protocol.c" $(pkg-config --libs wayland-client xkbcommon) -o "$RUNNER_TEMP/ember-ime/native-ime-return"

      - name: Gate native composing Return in each terminal mode
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' && steps.desktop-ime.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          for mode in normal block chat; do
            if ! python3 scripts/native-ime-return-smoke.py \
              --runner scripts/native-desktop-smoke.py \
              --ime-client "$RUNNER_TEMP/ember-ime/native-ime-return" \
              --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
              --mode "$mode" --output "native-smoke-artifacts/ime-return-$mode"; then
              status=1
            fi
          done
          exit "$status"

      - name: Gate IME lifecycle after live Settings mode switches
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' && steps.desktop-ime.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        run: |
          python3 scripts/test-native-settings-save-ocr.py
          python3 scripts/test-native-ime-live-switch.py
          python3 scripts/native-ime-live-switch.py \
            --ime-client "$RUNNER_TEMP/ember-ime/native-ime-return" \
            --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
            --output native-smoke-artifacts/ime-live-switch

      - name: Gate Settings switches during active IME preedit
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' && steps.desktop-ime.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        run: |
          python3 scripts/test-native-ime-preedit-switch.py
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/ember-ime" scripts/native-ime-preedit-switch.c "$RUNNER_TEMP/ember-ime/protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/ember-ime/native-ime-preedit-switch"
          python3 scripts/native-ime-preedit-switch.py \
            --ime-client "$RUNNER_TEMP/ember-ime/native-ime-return" \
            --preedit-client "$RUNNER_TEMP/ember-ime/native-ime-preedit-switch" \
            --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
            --output native-smoke-artifacts/ime-preedit-switch

      - name: Gate measured Wayland scales and narrow geometry
        if: ${{ !cancelled() && steps.desktop-install.outcome == 'success' && steps.desktop-pointer.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        run: |
          python3 scripts/test-native-wayland-geometry.py
          python3 scripts/test-native-wayland-configure.py
          status=0
          for scale in 1 1.5 2; do
            for window in tiled narrow; do
              if ! python3 scripts/native-wayland-geometry-smoke.py \
                --binary "$RUNNER_TEMP/ember-installed/bin/ember" \
                --scale "$scale" --window "$window" \
                --output "native-smoke-artifacts/geometry-$scale-$window"; then
                status=1
              fi
            done
          done
          exit "$status"

      - name: Preserve real desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ember-native-desktop-${{ github.sha }}
          path: native-smoke-artifacts
          if-no-files-found: error
          retention-days: 14
