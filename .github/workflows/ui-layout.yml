name: UI layout regressions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ui-layout-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  native-layout:
    name: Native Chat and composer geometry
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialize bundled shared core
        run: bash scripts/materialize-shared-core.sh

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig1-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ui-layout

      - name: Build production terminal
        run: cargo build --locked --bin ember

      # Independent checks still run after a previous test failure so an
      # unrelated regression cannot hide composer or selection failures.
      - name: Test Chat projection and native input ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib chat_

      - name: Test retained canvas scrolling and dock clipping
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib transcript_canvas_

      - name: Test same-frame resizing and input redocking
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib glass_layout_redocks_after_resize_and_preserves_input_ownership
