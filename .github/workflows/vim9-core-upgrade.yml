name: Prepare Vim9 core upgrade

on:
  push:
    branches: [master]
    paths: [.github/workflows/vim9-core-upgrade.yml]
  workflow_dispatch:
    inputs:
      core_revision:
        description: Full jterm_core commit SHA
        required: true
        default: 338011a4d0bb889df6e4116ac5221b50efca0620

permissions:
  contents: write

concurrency:
  group: vim9-core-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: beamiter/jterm_core/.github/workflows/prepare-vim9-core.yml@338011a4d0bb889df6e4116ac5221b50efca0620
    with:
      core_revision: ${{ inputs.core_revision || '338011a4d0bb889df6e4116ac5221b50efca0620' }}
