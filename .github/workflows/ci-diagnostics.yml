name: CI diagnostics

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Generate formatting patch and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git diff --binary > rustfmt.patch

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            rustfmt.patch
            Cargo.lock
            src/help.rs
            src/pty.rs
          if-no-files-found: error
          retention-days: 1
