name: Export validated Vim dialog sources
on:
  push:
    branches: [codex/vim-dialog-focus-20261024]
    paths: [.github/workflows/vim-dialog-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff877bb3de950852bfa177ef15d6047d1094e782
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate only the previously validated transformation
        run: |
          test "$(git rev-parse HEAD)" = ff877bb3de950852bfa177ef15d6047d1094e782
          python3 scripts/stage-vim9-dialog-focus.py
          python3 scripts/stage-release-paste.py
          bash scripts/materialize-shared-core.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Export exact bytes and Git blob identities without moving any ref
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          python3 - <<'PY'
          import json,subprocess,shutil
          from pathlib import Path
          base='387ec628ecab655819be3b571666f070673590a1'
          files=['src/vim9_ide.rs','src/vim9_dialog_focus.rs','src/main.rs','scripts/native-vim9-buffer-smoke.py','.github/workflows/ci.yml']
          temporary=['scripts/stage-vim9-dialog-focus.py','scripts/stage-release-paste.py','.github/workflows/vim-dialog-candidate.yml']
          changed=set(subprocess.check_output(['git','diff',base,'--name-only'],text=True).splitlines())
          assert changed==set(files+temporary), changed
          assert not subprocess.check_output(['git','diff',base,'--','Cargo.toml','Cargo.lock','font-group-harness/lib.rs','font-group-harness/Cargo.lock'])
          entries=[]
          for path in files:
              target=Path('export/files')/path
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path,target)
              sha=subprocess.check_output(['git','hash-object',path],text=True).strip()
              entries.append({'path':path,'mode':'100755' if path.startswith('scripts/') else '100644','type':'blob','sha':sha})
          Path('export/entries.json').write_text(json.dumps({'base':base,'tested_head':'ff877bb3de950852bfa177ef15d6047d1094e782','validation_run':40098238545,'entries':entries,'master_updated':False},indent=2)+'\n')
          Path('export/candidate.patch').write_bytes(subprocess.check_output(['git','diff',base,'--',*files]))
          print(Path('export/entries.json').read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-vim-dialog-sources
          path: export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
