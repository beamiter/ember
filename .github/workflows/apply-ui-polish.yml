name: Apply UI polish

on:
  push:
    branches:
      - agent/ui-polish-floating-panels
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-polish-floating-panels
          fetch-depth: 0

      - name: Update floating panel UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/rendering.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"expected source fragment not found: {old!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "        if self.search_state.is_open {\n",
              "        if self.search_state.is_open {\n"
              "            let screen_rect = ctx.viewport_rect();\n"
              "            let search_width = (screen_rect.width() - 24.0).clamp(300.0, 520.0);\n"
              "            let search_height = if self.search_state.error_message.is_some() {\n"
              "                82.0\n"
              "            } else {\n"
              "                52.0\n"
              "            };\n",
          )
          replace_once(
              "                .default_pos(egui::pos2(ctx.viewport_rect().right() - 430.0, 60.0))\n",
              "                .default_pos(egui::pos2(\n"
              "                    (screen_rect.right() - search_width - 12.0)\n"
              "                        .max(screen_rect.left() + 12.0),\n"
              "                    screen_rect.top() + 48.0,\n"
              "                ))\n",
          )
          replace_once("                .default_size([420.0, 50.0])\n", "                .default_size([search_width, search_height])\n")
          replace_once("                .fixed_size([420.0, 50.0])\n", "                .fixed_size([search_width, search_height])\n")

          replace_once(
              "                        if ui.button(\"↑\").clicked() {\n",
              "                        if ui\n"
              "                            .button(\"↑\")\n"
              "                            .on_hover_text(\"Previous match (Shift+Enter)\")\n"
              "                            .clicked()\n"
              "                        {\n",
          )
          replace_once(
              "                        if ui.button(\"↓\").clicked() {\n",
              "                        if ui\n"
              "                            .button(\"↓\")\n"
              "                            .on_hover_text(\"Next match (Enter)\")\n"
              "                            .clicked()\n"
              "                        {\n",
          )
          replace_once(
              "                        if ui.button(\"✕\").clicked() {\n",
              "                        if ui\n"
              "                            .button(\"✕\")\n"
              "                            .on_hover_text(\"Close search (Esc)\")\n"
              "                            .clicked()\n"
              "                        {\n",
          )

          replace_once("            let palette_width = 600.0;\n", "            let palette_width = (screen_rect.width() - 32.0).clamp(360.0, 720.0);\n")
          replace_once("            let palette_height = 400.0;\n", "            let palette_height = (screen_rect.height() - 96.0).clamp(300.0, 520.0);\n")
          replace_once("                (screen_rect.width() - palette_width) / 2.0,\n", "                screen_rect.center().x - palette_width / 2.0,\n")
          replace_once("                (screen_rect.height() - palette_height) / 3.0,\n", "                screen_rect.top() + (screen_rect.height() * 0.12).max(24.0),\n")
          replace_once("                .movable(true)\n", "                .movable(false)\n")
          replace_once(
              "                                    egui::Color32::from_rgb(70, 70, 80)\n",
              "                                    crate::theme::Theme::rgb_to_color32(\n"
              "                                        self.current_theme.tabbar.active_border,\n"
              "                                    )\n"
              "                                    .gamma_multiply(0.18)\n",
          )

          weak_old = ".color(egui::Color32::from_rgb(150, 150, 150)),"
          if text.count(weak_old) < 2:
              raise SystemExit("expected command-palette weak text colors were not found")
          text = text.replace(weak_old, ".color(ui.visuals().weak_text_color()),", 2)
          replace_once(
              ".color(egui::Color32::from_rgb(100, 100, 100)),",
              ".color(ui.visuals().weak_text_color()),",
          )

          path.write_text(text)
          PY

          rm -f .github/workflows/apply-ui-polish.yml UI_POLISH_PR_NOTE.md
          cargo fmt --all

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish floating panels"
          git push origin HEAD:agent/ui-polish-floating-panels

      - name: Validate
        run: cargo check
