name: Session startup benchmark (temporary instrumented builds)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "control/scripts/materialize-shared-core.sh" ]]; then
            bash "control/scripts/materialize-shared-core.sh"
          fi
      - name: Verify and expose reviewed plan
        id: plan
        run: |
          python3 - <<'PYTHON'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          root = Path('control')
          for relative, expected in {
              'scripts/benchmark-session-startup-plan.py': 'a85d2bf155d519745b605d2eef994a169838aaaada5267521d521baf25d0a610',
              'tests/fixtures/session-startup/paired-plan.json': 'ee27af3af4ab05111d7bcf6ad11d524611bff5d7e38de89a781eaa3f8ced7533',
          }.items():
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == expected, relative
          spec = importlib.util.spec_from_file_location('bench', root / 'scripts/benchmark-session-startup-plan.py')
          bench = importlib.util.module_from_spec(spec); spec.loader.exec_module(bench)
          plan = bench.read_plan(root / 'tests/fixtures/session-startup/paired-plan.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('baseline_sha', 'candidate_sha', 'driver_control_sha'):
                  out.write(f'{name}={plan[name]}\n')
          Path('benchmark-artifacts').mkdir()
          Path('benchmark-artifacts/paired-plan.json').write_text(json.dumps(plan, indent=2))
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.plan.outputs.baseline_sha }}
          path: baseline
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "baseline/scripts/materialize-shared-core.sh" ]]; then
            bash "baseline/scripts/materialize-shared-core.sh"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.plan.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "candidate/scripts/materialize-shared-core.sh" ]]; then
            bash "candidate/scripts/materialize-shared-core.sh"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.plan.outputs.driver_control_sha }}
          path: driver-control
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "driver-control/scripts/materialize-shared-core.sh" ]]; then
            bash "driver-control/scripts/materialize-shared-core.sh"
          fi
      - name: Install official build and desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb openbox xdotool xclip \
            x11-utils sway wtype wl-clipboard grim imagemagick tesseract-ocr fonts-dejavu-core \
            mesa-vulkan-drivers mesa-utils libxkbcommon-x11-0 libwayland-bin python3-psutil
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            baseline -> target
            candidate -> target
          shared-key: session-startup-benchmark
      - name: Check fixed-plan pure and static contracts
        run: python3 control/scripts/test-session-startup-benchmark.py
      - name: Verify baseline and preserve identities before overlay
        env:
          BASELINE_SHA: ${{ steps.plan.outputs.baseline_sha }}
          CANDIDATE_SHA: ${{ steps.plan.outputs.candidate_sha }}
        run: |
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C control status --porcelain)"
          test "$(git -C driver-control rev-parse HEAD)" = "${{ steps.plan.outputs.driver_control_sha }}"
          test -z "$(git -C driver-control status --porcelain)"
          printf '%s  %s\n' 19967416389d166f427aaa5b0337e31e8762dd4ca1d03b6d14cc1ef7661d620c control/scripts/benchmark-session-startup.py | sha256sum --check
          printf '%s  %s\n' 74c3daf63089139cf927db14a83f1979e071efda3791841d6a6ae942b701ebe8 control/tests/fixtures/session-startup/benchmark-overlay.patch | sha256sum --check
          printf '%s  %s\n' 15459be5d29042ab08ba7dd1fa67fdd4afd3799d33acbeb8c97446b384aad16f driver-control/scripts/native-desktop-smoke.py | sha256sum --check
          printf '%s  %s\n' ead6106b6df0fb28c8eeaccc33a5894c5a05d227193e417144f30347bf5db38b driver-control/scripts/native-pointer.c | sha256sum --check
          printf '%s  %s\n' 7849f8c25b5104da9dc508301414331cdd3c8fa33daf08f85b67a8fcd6e2f0b8 driver-control/scripts/protocols/wlr-virtual-pointer-unstable-v1.xml | sha256sum --check
          printf '%s  %s\n' 4d9b53092843e291ad09d16e72cd915df312185aa010291b098547e809db998e driver-control/scripts/native-pty-capture.py | sha256sum --check
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C baseline status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          cmp baseline/Cargo.lock candidate/Cargo.lock
          mkdir -p benchmark-artifacts
          { uname -a; lscpu; cat /etc/os-release; printf '%s %s\n' "$ImageOS" "$ImageVersion"; dpkg-query -W; rustc -Vv; git -C control rev-parse HEAD; printf '%s\n' "$BASELINE_SHA" "$CANDIDATE_SHA"; sha256sum baseline/Cargo.lock candidate/Cargo.lock control/tests/fixtures/session-startup/benchmark-overlay.patch; } > benchmark-artifacts/source-identity.txt
          for source in baseline candidate; do
            git -C "$source" apply --check "$GITHUB_WORKSPACE/control/tests/fixtures/session-startup/benchmark-overlay.patch"
          done
      - name: Build two temporary instrumented binaries
        run: |
          for source in baseline candidate; do
            git -C "$source" apply "$GITHUB_WORKSPACE/control/tests/fixtures/session-startup/benchmark-overlay.patch"
            git -C "$source" diff --binary > "benchmark-artifacts/$source-overlay.diff"
            cargo build --manifest-path "$source/Cargo.toml" --workspace --release --all-features --locked
            cp "$source/target/release/ember" "$RUNNER_TEMP/ember-benchmark-$source"
          done
          sha256sum "$RUNNER_TEMP/ember-benchmark-baseline" "$RUNNER_TEMP/ember-benchmark-candidate" > benchmark-artifacts/binary-identity.txt
      - name: Build compositor pointer prerequisite for shared desktop driver
        run: |
          mkdir -p "$RUNNER_TEMP/ember-pointer"
          wayland-scanner client-header driver-control/scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/ember-pointer/wlr-virtual-pointer-unstable-v1-client-protocol.h"
          wayland-scanner private-code driver-control/scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/ember-pointer/protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/ember-pointer" driver-control/scripts/native-pointer.c "$RUNNER_TEMP/ember-pointer/protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/ember-pointer/native-pointer"
          echo "EMBER_POINTER_HELPER=$RUNNER_TEMP/ember-pointer/native-pointer" >> "$GITHUB_ENV"
      - name: Fixed paired main-entry to pre-visibility first-frame samples
        run: |
          /usr/bin/python3 control/scripts/benchmark-session-startup-plan.py \
            --baseline "$RUNNER_TEMP/ember-benchmark-baseline" \
            --candidate "$RUNNER_TEMP/ember-benchmark-candidate" \
            --driver-root driver-control --backend "${{ matrix.backend }}" \
            --plan control/tests/fixtures/session-startup/paired-plan.json \
            --overlay control/tests/fixtures/session-startup/benchmark-overlay.patch \
            --control-sha "$GITHUB_SHA" --output "benchmark-artifacts/${{ matrix.backend }}"
      - name: Preserve all timing and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ember-session-startup-benchmark-${{ github.run_id }}-${{ matrix.backend }}
          path: benchmark-artifacts
          if-no-files-found: error
          retention-days: 14
