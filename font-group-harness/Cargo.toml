[package]
name = "ember-font-group-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
egui = "=0.36.1"

[lib]
path = "lib.rs"

[dev-dependencies]
shared_core = { package = "jterm_core", version = "0.2.0", git = "https://github.com/beamiter/jterm_core.git", rev = "3b378da1dceadd2c0d6c6676a89d685e146b163f" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
once_cell = "=1.21.4"
uuid = { version = "=1.26.0", features = ["v4"] }
dirs = "=6.0.0"
libc = "=0.2.189"

[[test]]
name = "config_harness"
path = "config_harness.rs"
