[package]
name = "ember"
version = "0.4.0"
edition = "2021"
description = "A GPU-accelerated terminal emulator built with Rust and egui"
repository = "https://github.com/beamiter/ember"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "terminal-emulator", "egui", "wgpu"]
categories = ["command-line-utilities", "gui"]

[dependencies]
# Shared engine and compatibility core resolve one published source tree.
jterm_engine = { version = "0.1.0", git = "https://github.com/beamiter/jterm_core.git", rev = "7da31cd1a9e915b85539bed38a14567cf41f9a49" }
companion-host = { version = "0.1.0", path = "vendor/companion-host" }
libc = "0.2"
# Immutable shared release; local candidates require an explicit Cargo --config override.
jterm_core = { version = "0.2.0", git = "https://github.com/beamiter/jterm_core.git", rev = "7da31cd1a9e915b85539bed38a14567cf41f9a49" }
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1.0"
egui = "0.36.1"
winit = { version = "=0.30.13", default-features = false }
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui-wgpu = "0.36.1"
# Keep this aligned with egui-wgpu/eframe 0.36. A second wgpu major version
# makes callback trait types incompatible even when their names are identical.
wgpu = "=30.0.1"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
fontdue = "0.9.4"
unicode-width = "0.2"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
regex = "1.13"
serde_json = { version = "1.0", features = ["raw_value"] }
fuzzy-matcher = "0.3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1.1.3"
# YAML loading lives in the pinned jterm_core; ember has no separate YAML parser.
dirs = "7.0.0"
lru = "0.18"
smallvec = "1.15"
once_cell = "1.21"
# Read-only, event-driven desktop accessibility preference subscription.
mundy = { version = "=0.2.3", default-features = false, features = ["async-io", "callback", "reduced-motion"] }

# HarfRust is the maintained RustyBuzz successor. It is already shared with
# egui's font stack, and uses read-fonts instead of adding another parser.
harfrust = "0.14.0"

[dev-dependencies]
# Test-only integrity check for losslessly sharded original-production evidence.
sha2 = "0.10"
jterm_core = { version = "0.2.0", features = ["session-parity-tests"], git = "https://github.com/beamiter/jterm_core.git", rev = "7da31cd1a9e915b85539bed38a14567cf41f9a49" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "terminal_benchmark"
harness = false

# 编译优化配置
[profile.dev]
# 增量编译加速重编译
incremental = true

# 为依赖项启用小优化，平衡编译时间和运行性能
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3

# Keep fork tests and their dev dependencies in the same audited lockfile.
[workspace]
resolver = "2"
members = [
    "vendor/mundy",
    "vendor/accesskit_unix",
    "vendor/accesskit_atspi_common",
    "vendor/atspi-common",
    "vendor/atspi-proxies",
]
default-members = ["."]
# Keep existing independent harnesses and upstream vendor snapshots standalone.
exclude = [
    "font-group-harness",
    "vendor/companion-client",
    "vendor/companion-host",
    "vendor/companion-protocol",
    "vendor/eframe",
    "vendor/egui-wgpu",
    "vendor/egui-winit",
    "vendor/smithay-clipboard",
    "vendor/wgpu-hal",
    "vendor/winit",
]

[patch.crates-io]
# Auditable Linux D-Bus compatibility patches. See docs/linux-dbus-zbus6.md.
mundy = { path = "vendor/mundy" }
accesskit_unix = { path = "vendor/accesskit_unix" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
atspi-common = { path = "vendor/atspi-common" }
atspi-proxies = { path = "vendor/atspi-proxies" }
wgpu-hal = { path = "vendor/wgpu-hal" }
# X11 legacy wheel release must not emit a second scroll notch.
winit = { path = "vendor/winit" }
eframe = { path = "vendor/eframe" }

egui-wgpu = { path = "vendor/egui-wgpu" }
egui-winit = { path = "vendor/egui-winit" }

# Preserve seat selection devices across virtual-keyboard hotplug.
smithay-clipboard = { path = "vendor/smithay-clipboard" }
[patch."https://github.com/beamiter/jcompanion.git"]
companion-protocol = { path = "vendor/companion-protocol" }
companion-client = { path = "vendor/companion-client" }
