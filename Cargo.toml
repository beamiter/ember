[package]
name = "jterm2"
version = "0.4.0"
edition = "2021"

[dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"
crossbeam = "0.8"
parking_lot = "0.12"
anyhow = "1.0"
egui = "0.34.2"
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui-wgpu = "0.34.2"
vte = "0.15.0"
wgpu = "29.0.3"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
fontdue = "0.9"
winit = "0.30.13"
tokio = { version = "1.52", features = ["full"] }
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
regex = "1.12"
serde_json = "1.0"
fuzzy-matcher = "0.3"
base64 = "0.22"
image = "0.25"
toml = "1.1.2"
dirs = "6.0.0"
lru = "0.17"
smallvec = "1.15"
once_cell = "1.21"

nix = { version = "0.31.3", features = ["process"] }
x11-clipboard = "0.9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "terminal_benchmark"
harness = false

# 编译优化配置
[profile.dev]
# 增量编译加速重编译
incremental = true

# 为依赖项启用小优化，平衡编译时间和运行性能
[profile.dev.package."*"]
opt-level = 1

[profile.release]
# 启用 LTO (Link Time Optimization) 提升性能
lto = "thin"
# 剥离调试符号减小二进制大小
strip = true
# 单个代码生成单元以最大化优化（会增加编译时间）
codegen-units = 1
# 启用更激进的优化
opt-level = 3
