[package]
name = "jterm2"
version = "0.4.0"
edition = "2021"
description = "A GPU-accelerated terminal emulator built with Rust and egui"
repository = "https://github.com/beamiter/jterm2"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "egui", "wgpu"]
categories = ["command-line-utilities", "gui"]

[dependencies]
libc = "0.2"
jterm_core = { git = "https://github.com/beamiter/jterm_core.git", branch = "master" }
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1.0"
egui = "0.35.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu", "glow", "wayland", "x11"] }
egui-wgpu = "0.35.0"
# Keep this aligned with egui-wgpu/eframe 0.35. A second wgpu major version
# makes callback trait types incompatible even when their names are identical.
wgpu = "=29.0.4"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
fontdue = "0.9"
unicode-width = "0.2"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
regex = "1.13"
serde_json = "1.0"
fuzzy-matcher = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1.1.3"
dirs = "6.0.0"
lru = "0.18"
smallvec = "1.15"
once_cell = "1.21"

rustybuzz = "0.20"
ttf-parser = "0.25"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "terminal_benchmark"
harness = false

# 编译优化配置
[profile.dev]
# 增量编译加速重编译
incremental = true

# 为依赖项启用小优化，平衡编译时间和运行性能
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3
